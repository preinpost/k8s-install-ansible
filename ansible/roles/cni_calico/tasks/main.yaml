- name: calico CNI 설치
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  vars:
    calico_manifest_path: "/tmp/{{ calico_manifest_name }}-{{ calico_manifest_version }}.yaml"
    calico_ipip_value: "{{ 'Always' if calico_encapsulation | upper == 'IPIP' else 'Never' }}"
    calico_vxlan_value: "{{ 'Always' if calico_encapsulation | upper == 'VXLAN' else 'Never' }}"
  block:
    # calico-node 가 kube-proxy 없이도 API 서버에 직접 접속하도록 지정한다.
    # (컨트롤플레인 hostname 은 add_master_to_hosts 롤이 /etc/hosts 에 등록)
    - name: kubernetes-services-endpoint ConfigMap 생성
      ansible.builtin.shell: |
        kubectl apply -f - << 'EOF'
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: kubernetes-services-endpoint
          namespace: kube-system
        data:
          KUBERNETES_SERVICE_HOST: "{{ hostvars[groups['controlplane_group'][0]]['hostname'] }}"
          KUBERNETES_SERVICE_PORT: "{{ k8s_api_server_port }}"
        EOF
      args:
        executable: /bin/bash
      changed_when: true


    # upstream 원본을 복사한 뒤 아래 task 들에서 필요한 값만 덮어쓴다
    - name: Calico manifest 파일 복사 (upstream 원본)
      ansible.builtin.copy:
        src: "{{ role_path }}/files/{{ calico_manifest_name }}-{{ calico_manifest_version }}.yaml"
        dest: "{{ calico_manifest_path }}"
        mode: '0644'


    - name: 캡슐화 방식 적용 ({{ calico_encapsulation }})
      ansible.builtin.replace:
        path: "{{ calico_manifest_path }}"
        regexp: '(- name: CALICO_IPV4POOL_{{ item.key }}\n\s+value: )"[^"]*"'
        replace: '\g<1>"{{ item.value }}"'
      loop:
        - { key: IPIP, value: "{{ calico_ipip_value }}" }
        - { key: VXLAN, value: "{{ calico_vxlan_value }}" }
      loop_control:
        label: "CALICO_IPV4POOL_{{ item.key }}={{ item.value }}"


    # NIC 가 여러 개인 노드에서 Calico 기본값(first-found)은 엉뚱한 인터페이스를
    # 고를 수 있고, kubelet node-ip 와 어긋나면 노드 간 라우팅이 깨진다.
    - name: IP_AUTODETECTION_METHOD 설정 ({{ calico_ip_autodetection_method }})
      ansible.builtin.replace:
        path: "{{ calico_manifest_path }}"
        regexp: '((\n[ ]+)- name: IP\n[ ]+value: "autodetect")'
        replace: '\g<1>\g<2>- name: IP_AUTODETECTION_METHOD\g<2>  value: "{{ calico_ip_autodetection_method }}"'
      when: calico_ip_autodetection_method | default('', true) | length > 0


    # tailscale 과 Calico 가 같은 fwmark 비트를 쓰면 트래픽이 끊긴다
    - name: tailscale 공존용 FELIX_IPTABLESMARKMASK 주입
      ansible.builtin.replace:
        path: "{{ calico_manifest_path }}"
        regexp: '((\n[ ]+)- name: FELIX_HEALTHENABLED\n[ ]+value: "true")'
        replace: '\g<1>\g<2>- name: FELIX_IPTABLESMARKMASK\g<2>  value: "{{ calico_tailscale_iptables_mark_mask }}"'
      when: tailscale_enabled | default(false) | bool


    - name: Calico CNI 적용
      ansible.builtin.command: "kubectl apply -f {{ calico_manifest_path }}"
      changed_when: true


    - name: calico-node 데몬셋이 기동될 때까지 대기
      ansible.builtin.command: >-
        kubectl -n kube-system rollout status daemonset/calico-node --timeout=300s
      register: calico_rollout
      changed_when: false
      retries: 3
      delay: 20
      until: calico_rollout.rc == 0


    - name: 컨트롤플레인 노드가 Ready 가 될 때까지 대기
      ansible.builtin.command: >-
        kubectl wait --for=condition=Ready node --all --timeout=300s
      changed_when: false

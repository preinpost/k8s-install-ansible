- name: vm 초기 설정
  import_playbook: init/playbook-edit-vm.yaml


- name: Install Common Components
  hosts: k8s_group
  roles:
    - roles/install_k8s_components


# 인벤토리마다 호스트 이름이 다를 수 있으니 그룹의 첫 번째 노드를 지정한다
- name: ControlPlane Init
  hosts: controlplane_group[0]
  roles:
    - roles/kubeadm_init


# - name: CNI Install (Flannel)
#   hosts: controlplane_group[0]
#   roles:
#     - roles/cni_flannel


- name: CNI Install (Calico)
  hosts: controlplane_group[0]
  roles:
    - roles/cni_calico


- name: Worker Join
  hosts: worker_group
  roles:
    - roles/worker_join
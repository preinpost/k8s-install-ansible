# ------------------------------------------------------------------
# lima 테스트 환경용 복사본.
# 운영 인벤토리(inventories/k8s_inventory/group_vars/k8s_group.yaml)와
# 같은 값을 유지한다. 버전 실험은 이 파일에서 먼저 해보면 된다.
# ------------------------------------------------------------------
# Kubernetes 버전
#   k8s_install_version : pkgs.k8s.io 저장소 경로에 쓰이는 마이너 버전 (vX.Y)
#   k8s_patch_version   : 패치 버전
#
# 2026-09 기준 최신 stable 은 v1.37.0 이지만,
# Calico v3.32(현재 최신) 가 공식 테스트한 조합은 k8s 1.34 ~ 1.36 이라
# 기본값은 1.36 최신 패치로 둔다. 1.37 로 올리려면 아래 두 값만 바꾸면 된다.
#   k8s_install_version: "v1.37"
#   k8s_patch_version: "0"
# ------------------------------------------------------------------
k8s_install_version: "v1.36"
k8s_patch_version: "4"
k8s_install_version_semver: "{{ k8s_install_version }}.{{ k8s_patch_version }}"

# deb 패키지 버전 (예: 1.36.4-*) - 패키지 revision(-1.1) 은 와일드카드로 처리
k8s_package_version: "{{ k8s_install_version_semver | replace('v', '') }}-*"
kubeadm_version: "{{ k8s_package_version }}"
kubelet_version: "{{ k8s_package_version }}"
kubectl_version: "{{ k8s_package_version }}"

# ------------------------------------------------------------------
# 클러스터 네트워크 / 런타임
# ------------------------------------------------------------------
k8s_pod_subnet: "172.16.0.0/16"
k8s_service_subnet: "10.96.0.0/12"
k8s_api_server_port: 6443
k8s_cri_socket: "unix:///run/containerd/containerd.sock"

# 사내망 클러스터 기준. true 로 바꾸면 tailscale 설치 + Calico fwmark 회피 설정이 같이 적용된다.
tailscale_enabled: false
